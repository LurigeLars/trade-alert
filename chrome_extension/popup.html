<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Alert · Trump Monitor</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><div><span class="eyebrow">TRADE ALERT</span><h1>Trump Monitor</h1></div><span id="pair-status" role="status">Checking…</span></header>
<main>
<section class="monitor" aria-label="Background monitor">
  <div class="monitor-top"><h2>Background monitor</h2><button id="power" type="button" role="switch" aria-checked="false" aria-label="Background monitoring" disabled><span class="dot" aria-hidden="true"></span><span id="power-label">—</span></button></div>
  <p id="status" role="status">Checking monitor status…</p>
  <p class="hint">Keep Chrome running.</p>
</section>
<p id="notice" role="status" hidden></p>
<button id="open" class="backup" type="button" disabled>Backup Monitor <span aria-hidden="true">↗</span></button>
<p id="feedback" role="status"></p>
<details id="pairing" hidden><summary id="pairing-summary">Pair with Trade Alert</summary>
  <form id="pair-form"><label for="pair-code">One-time pairing code</label><div class="pair-fields"><input id="pair-code" type="text" maxlength="20" required pattern="[A-Fa-f0-9]{20}" placeholder="20-character code" spellcheck="false" autocomplete="off" autocapitalize="characters"><button id="pair" type="submit" disabled>Pair</button></div>
  <p id="pair-feedback" role="status"></p>
  <p class="hint">Generate a code in PowerShell:<br><code>python -m trade_alert.chrome_pairing pair</code><br>Valid for 10 minutes.</p></form>
</details>
<details id="diagnostics"><summary>Details</summary><dl><div><dt>Background</dt><dd id="background-status">—</dd></div><div><dt>Last check</dt><dd id="checked">—</dd></div><div><dt>Tab backup</dt><dd id="tab-status">—</dd></div><div><dt>Local delivery</dt><dd id="delivery-status">—</dd></div></dl></details>
</main>
<script src="popup.js"></script>
</body>
</html>
