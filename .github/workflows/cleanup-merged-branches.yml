name: Cleanup merged branches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged head branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import sys

          branch = os.environ["HEAD_REF"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,199}", branch):
              sys.exit(f"Invalid branch name: {branch}")
          if ".." in branch or "//" in branch or branch.endswith("/") or branch.endswith(".lock"):
              sys.exit(f"Unsafe branch name: {branch}")
          PY
          encoded_ref="$(python -c 'import os; from urllib.parse import quote; print(quote(os.environ["HEAD_REF"], safe=""))')"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded_ref"
