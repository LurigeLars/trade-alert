name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Package smoke test
        run: python -m trade_alert --help

      - name: Chrome extension JavaScript checks
        shell: pwsh
        run: |
          node --check .\chrome_extension\reader.js
          node --check .\chrome_extension\relay.js
          node --check .\chrome_extension\background.js
          node --check .\chrome_extension\popup.js
          node --test .\tests\test_chrome_extension.cjs
          node --test .\tests\test_chrome_relay.cjs
          node --test .\tests\test_chrome_popup.cjs


      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem .\scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
              $failed = $true
            }
          }
          if ($failed) {
            throw 'PowerShell syntax validation failed.'
          }
