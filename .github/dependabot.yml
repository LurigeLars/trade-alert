version: 2

# One weekly pull request for all version updates (every ecosystem), so the
# strict up-to-date branch rule needs a single CI run. Security updates are
# not part of this group and still open immediately.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: saturday
      time: "05:20"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
